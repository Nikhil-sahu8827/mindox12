services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: docmind-prod-postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-docmind}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres_secure_pass}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-docmind}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docmind-prod-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-docmind}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:-postgres_secure_pass}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-your-gemini-api-key}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      OPENAI_MODEL: ${OPENAI_MODEL:-gemini-flash-lite-latest}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      LOG_LEVEL: INFO
      APP_LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - docmind_uploads:/app/uploads
      - docmind_kb:/app/data/website_knowledge

volumes:
  pgdata_prod:
  docmind_uploads:
  docmind_kb:
